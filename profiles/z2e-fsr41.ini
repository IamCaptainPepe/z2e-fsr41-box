; z2e-fsr41-box — профиль для Ryzen Z2 Extreme (Radeon 890M, RDNA 3.5, gfx1150):
; ROG Xbox Ally X, MSI Claw A8 BZ2EM и аналоги.
; Мержится scripts/IniMerge.ps1 в OptiScaler.ini игры.
;
; Алиасы ключей форса INT8 (сверять с OptiScaler.ini конкретного релиза):
;   Fsr4ForceModel=2          — форс модели INT8 (0 = no override, 1 = FP8, 2 = INT8).
;                               Ключ есть в master с v0.9.x. Ставится только если ключ
;                               присутствует в ini релиза.
;   Fsr4ForceEnableInt8=true  — старый алиас (упоминается в notes v0.9.4). Ставится
;                               только если такой ключ реально есть в ini релиза.
;   Если в ini есть оба ключа — ставятся оба.
;
; Fsr4Update: на RDNA 3.5 НЕ ставить true — частый автооткат в FSR3.
;   Если ключ есть в ini — ставим false; если ключа нет — НЕ добавляем.
;
; FP8 (Fsr4ForceModel=1) на Z2E не использовать НИКОГДА (RDNA 4 only).
;
; Fsr4EnableWatermark=true  — единственный надёжный способ проверки: ватермарк
;   FSR4-i8 / 4.1.1 = успех, FSR3 = провал форса.
; Fsr4DoNotLoadAmdxc64=true — не грузить проприетарный компилятор AMD.

[FSR]
Fsr4ForceModel=2
Fsr4ForceEnableInt8=true
Fsr4EnableWatermark=true
Fsr4DoNotLoadAmdxc64=true
Fsr4Update=false
